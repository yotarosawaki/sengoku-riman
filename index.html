<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c1633">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>出陣！戦国リーマン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1633; --bg2:#2a2150; --gold:#ffcf4a; --gold2:#e0a722; --ink:#fff; --muted:#b9b1d8;
  --sala:#3b6fd1; --tube:#e0483e; --con:#8a4fd6; --none:#3f9e5a;
  --p1:#2f7de1; --p2:#e23b3b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
#app{position:fixed;inset:0;display:flex;justify-content:center}
.screen{display:none;width:100%;max-width:480px;height:100%;flex-direction:column;position:relative;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen.show{display:flex}

/* ---------- タイトル ---------- */
#title{align-items:center;justify-content:center;gap:14px;padding:24px 20px;
  background:radial-gradient(circle at 50% 30%,#3d2f78 0,var(--bg) 70%)}
.logo{text-align:center;line-height:1.05}
.logo small{display:block;font-size:14px;color:var(--gold);letter-spacing:.2em;margin-bottom:6px}
.logo h1{margin:0;font-size:44px;font-weight:800;color:#fff;
  text-shadow:0 3px 0 #b23a2a,0 6px 0 #5b1a12,0 10px 18px rgba(0,0,0,.5)}
.logo h1 span{color:var(--gold)}
.tri-art{width:220px;height:170px}
.btn{width:100%;max-width:320px;padding:14px 16px;border-radius:14px;font-size:18px;font-weight:800;
  background:linear-gradient(#ffdb6e,var(--gold2));color:#3a2200;box-shadow:0 5px 0 #8a5b00;letter-spacing:.05em}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a5b00}
.btn.red{background:linear-gradient(#ff7a6b,#d33a2c);color:#fff;box-shadow:0 5px 0 #7d1c13}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35);font-size:15px;padding:11px}
.diff{display:flex;gap:6px;max-width:320px;width:100%}
.diff button{flex:1;padding:8px 0;border-radius:10px;background:rgba(255,255,255,.1);font-size:14px;font-weight:800;color:var(--muted)}
.diff button.on{background:#fff;color:var(--bg)}
.btn.net{background:linear-gradient(#7fd0ff,#2f7de1);color:#fff;box-shadow:0 5px 0 #174a94}
.btn.net:active{box-shadow:0 2px 0 #174a94}
#online{align-items:center;justify-content:center;gap:16px;padding:24px 20px;
  background:radial-gradient(circle at 50% 30%,#2b3f78 0,var(--bg) 70%)}
.on-box{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;align-items:center}
.spinner{width:44px;height:44px;border-radius:50%;border:5px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.on-track{width:100%;height:12px;border-radius:6px;background:#0d0a1c;border:2px solid #4b3f86;overflow:hidden}
#on-bar{height:100%;width:0;background:linear-gradient(90deg,#7fd0ff,#2f7de1)}
.on-limits{width:100%;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.join{display:flex;gap:8px;width:100%}
.join input{flex:1;min-width:0;font:inherit;font-size:24px;font-weight:800;text-align:center;letter-spacing:.3em;
  border-radius:14px;border:3px solid #4b3f86;background:#0d0a1c;color:#fff;padding:8px;-webkit-user-select:text;user-select:text}
.join .btn{width:auto;flex:none;padding:14px 22px}
.code{font-size:56px;font-weight:800;letter-spacing:.2em;color:var(--gold);text-shadow:0 4px 0 #7a4b00}
.on-status{min-height:20px;font-size:13px;color:#ffb3a8;text-align:center;max-width:320px}
.row2{display:flex;gap:8px;max-width:320px;width:100%}
.note{font-size:11px;color:var(--muted);text-align:center}

/* ---------- キャラ選択 ---------- */
#select{background:var(--bg)}
.sel-head{padding:12px 14px 6px;text-align:center}
.sel-head h2{margin:0;font-size:19px}
.sel-head h2 .who{padding:2px 10px;border-radius:8px;margin-right:6px}
.sel-head p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.aff{display:flex;justify-content:center;gap:4px;font-size:11px;margin-top:6px;flex-wrap:wrap}
.aff b{padding:1px 6px;border-radius:6px}
#grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:8px;padding:8px 10px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.cc{position:relative;text-align:left;background:var(--bg2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;border:3px solid transparent}
.cc.on{border-color:var(--gold);background:#3a2e6b}
.cc .top{display:flex;gap:6px;align-items:center;min-width:0}
.cc .top>div{min-width:0}
.aff{padding:0 8px}
.cc img{width:54px;height:54px;border-radius:10px;background:rgba(255,255,255,.08);object-fit:contain;flex:none}
.cc .nm{font-size:13px;font-weight:800;line-height:1.2}
.cc .sb{font-size:10px;color:var(--muted)}
.cc .ds{font-size:10.5px;color:#ddd6f5;line-height:1.35}
.cc .st{font-size:10px;color:var(--muted)}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;color:#fff;font-weight:800}
.t-sala{background:var(--sala)} .t-tube{background:var(--tube)} .t-con{background:var(--con)} .t-none{background:var(--none)}
.cost{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;background:#c04dff;
  border:2px solid #fff;font-size:14px;font-weight:800;display:grid;place-items:center;color:#fff;z-index:2}
.cc .num{position:absolute;top:6px;left:6px;background:var(--gold);color:#3a2200;border-radius:50%;width:22px;height:22px;
  display:none;place-items:center;font-weight:800;font-size:13px}
.cc.on .num{display:grid}
.sel-foot{padding:8px 12px 12px;display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.25)}
.sel-foot .btn{font-size:16px;padding:12px}
.sel-foot .btn.ghost{width:auto;flex:none;padding:12px 14px}

/* ---------- バトル ---------- */
#battle{background:#0f0c1f}
#field-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#cv{display:block;border-radius:6px;touch-action:none}
.panel{padding:6px 8px;background:linear-gradient(#2a2150,#1c1633);display:flex;flex-direction:column;gap:5px}
.panel.top{transform:rotate(180deg)}
.panel.p0{border-top:3px solid var(--p1)} .panel.p1{border-top:3px solid var(--p2)}
.p-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.p-name{padding:1px 8px;border-radius:6px}
.p0 .p-name{background:var(--p1)} .p1 .p-name{background:var(--p2)}
.p-hp{flex:1;color:#ddd}
.p-timer{font-size:18px;color:var(--gold);min-width:48px;text-align:right}
.p-timer.ot{color:#ff6b5b}
.p-hint{font-size:10px;color:var(--muted)}
.lanes{display:flex;gap:6px}
.lane{flex:1;padding:7px 0;border-radius:10px;background:rgba(255,255,255,.08);font-weight:800;font-size:14px;color:var(--muted)}
.armed .lane{background:#fff;color:#1c1633;animation:pulse .9s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--gold)}}
.cards{display:flex;gap:6px;touch-action:none}
.ghost{position:fixed;z-index:40;pointer-events:none;display:none;transform:translate(-50%,-85%);text-align:center}
.ghost img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.ghost span{display:block;font-size:12px;font-weight:800;color:#fff;background:rgba(0,0,0,.7);border-radius:8px;padding:2px 8px;white-space:nowrap}
.ghost.off img{opacity:.45;filter:grayscale(1)}
.ghost.flip{transform:translate(-50%,-15%) rotate(180deg)}
.card{flex:1;position:relative;height:66px;border-radius:12px;background:var(--bg2);overflow:visible;padding:0;border:3px solid transparent}
.card img{position:absolute;inset:3px 3px 16px;width:calc(100% - 6px);height:calc(100% - 19px);object-fit:contain}
.card .cname{position:absolute;left:0;right:0;bottom:2px;font-size:9.5px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden}
.card .charge{position:absolute;left:0;right:0;top:0;height:calc((1 - var(--p,1))*100%);background:rgba(0,0,0,.6);border-radius:9px 9px 0 0;pointer-events:none}
.card.sel{border-color:var(--gold);transform:translateY(-4px)}
.card.no{filter:grayscale(.6)}
.card.bump{animation:bump .3s}
@keyframes bump{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.card .cost{top:-7px;right:-5px;width:22px;height:22px;font-size:12px}
.gauge{position:relative;height:18px;border-radius:9px;background:#0d0a1c;overflow:hidden;border:2px solid #4b3f86}
.gfill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#c04dff,#ff6ad5);width:50%}
.gauge.ot .gfill{background:linear-gradient(90deg,#ff8a00,#ffd23f)}
.gticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(0,0,0,.45) calc(10% - 2px) 10%)}
.gnum{position:absolute;left:8px;top:-1px;font-weight:800;font-size:13px;text-shadow:0 1px 2px #000}
.panel.com{flex-direction:row;align-items:center}
#banner{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none;
  font-size:30px;font-weight:800;color:#fff;text-shadow:0 3px 0 #b23a2a,0 0 12px #000;opacity:0}
#banner.go{animation:ban 1.6s ease-out}
@keyframes ban{0%{opacity:0;transform:translateY(-50%) scale(2)}15%{opacity:1;transform:translateY(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}

/* ---------- オーバーレイ ---------- */
.overlay{position:absolute;inset:0;background:rgba(10,6,25,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;z-index:10}
.hidden{display:none!important}
.res-big{font-size:40px;font-weight:800;color:var(--gold);text-shadow:0 4px 0 #7a4b00;text-align:center}
.res-sub{font-size:15px;color:#ddd;text-align:center}
.res-flip{transform:rotate(180deg);font-size:24px;font-weight:800;color:var(--gold);text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.modal-box{background:#fff;color:#222;border-radius:16px;max-width:460px;width:100%;max-height:90%;display:flex;flex-direction:column;overflow:hidden}
#modal-body{overflow-y:auto;padding:16px;font-size:13.5px;line-height:1.6;-webkit-user-select:text;user-select:text;touch-action:pan-y}
#modal-body h3{margin:0 0 8px;font-size:18px}
#modal-body h4{margin:14px 0 4px;font-size:14px}
#modal-body .pr{background:#f3f0fb;border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap;margin:4px 0}
#modal-body .cp{font-size:12px;padding:5px 12px;border-radius:8px;background:#5b3fd6;color:#fff;font-weight:800}
#modal-body code{background:#eee;padding:0 4px;border-radius:4px}
#modal-close{padding:14px;font-size:16px;font-weight:800;background:#eee;color:#222}
</style>
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <section id="title" class="screen show">
    <div class="logo"><small>サラリーマン × 戦国 リアルタイム合戦</small><h1>出陣！<br><span>戦国</span>リーマン</h1></div>
    <canvas class="tri-art" id="tri-art" width="440" height="340"></canvas>
    <div class="diff" id="diff">
      <button data-d="easy">やさしい</button><button data-d="normal" class="on">ふつう</button><button data-d="hard">つよい</button>
    </div>
    <button class="btn" id="btn-com">COMと合戦</button>
    <button class="btn red" id="btn-pvp">ふたりで合戦（1台で対面）</button>
    <button class="btn net" id="btn-net">ネットで合戦（だれかと対戦）</button>
    <div class="row2">
      <button class="btn ghost" id="btn-howto">遊び方</button>
      <button class="btn ghost" id="btn-gemini">キャラデザ指示</button>
    </div>
    <div class="note">スマホは縦持ち推奨。ふたりで遊ぶときは机に置いて向かい合ってね。</div>
  </section>

  <!-- キャラ選択 -->
  <section id="select" class="screen">
    <div class="sel-head">
      <h2 id="sel-title"></h2>
      <p>8人から3人を選んで出陣！（相手に有利な属性は1.5倍ダメージ）</p>
      <div class="aff">
        <b class="t-sala">リーマン</b>▶<b class="t-tube">YouTuber</b>▶<b class="t-con">コンサル</b>▶<b class="t-sala">リーマン</b>
      </div>
    </div>
    <div id="grid"></div>
    <div class="sel-foot">
      <button class="btn ghost" id="sel-back">戻る</button>
      <button class="btn ghost" id="sel-rand">おまかせ</button>
      <button class="btn" id="sel-ok" disabled>出陣（0/3）</button>
    </div>
    <div id="handoff" class="overlay hidden">
      <div class="res-big" style="font-size:28px">P2の番です</div>
      <div class="res-sub">端末を相手に渡してね。<br>P2は画面の<b>上側</b>から戦います。</div>
      <button class="btn red" id="handoff-ok">P2のキャラを選ぶ</button>
    </div>
    <div id="sel-wait" class="overlay hidden">
      <div class="res-big" style="font-size:26px">相手のキャラ選択を<br>待っています…</div>
      <div class="res-sub" id="sel-wait-sub"></div>
      <button class="btn ghost" id="sel-wait-leave" style="max-width:320px">部屋を出る</button>
    </div>
  </section>

  <!-- ネット対戦 待合室 -->
  <section id="online" class="screen">
    <div class="logo"><small>ネット対戦</small><h1 style="font-size:34px">待合室</h1></div>
    <div id="on-searching" class="on-box">
      <div class="spinner"></div>
      <div class="res-sub" id="on-msg">対戦相手をさがしています…</div>
      <div class="note">待ち時間</div>
      <div class="code" id="on-count">0:00</div>
      <div class="on-track"><div id="on-bar"></div></div>
      <div class="on-limits"><span id="on-left">あと 5:00</span><span>最大 5:00</span></div>
      <button class="btn ghost" id="on-cancel">やめる</button>
    </div>
    <div id="on-timeout" class="on-box hidden">
      <div class="res-big" style="font-size:24px">5分待っても<br>相手が見つかりませんでした</div>
      <button class="btn" id="on-retry">もう一度さがす</button>
      <button class="btn red" id="on-com">COMと合戦する</button>
      <button class="btn ghost" id="on-back">タイトルへ</button>
    </div>
    <div id="on-status" class="on-status"></div>
  </section>

  <!-- バトル -->
  <section id="battle" class="screen">
    <div class="panel top p1" id="panel1"></div>
    <div id="field-wrap"><canvas id="cv"></canvas><div id="banner"></div></div>
    <div class="panel bottom p0" id="panel0"></div>
    <div id="result" class="overlay hidden">
      <div class="res-flip" id="res-flip"></div>
      <div class="res-big" id="res-big"></div>
      <div class="res-sub" id="res-sub"></div>
      <div class="note hidden" id="res-note">部屋を作った人が「もう一度対戦」を押すと始まります</div>
      <button class="btn" id="res-again">同じ編成で再戦</button>
      <button class="btn ghost" id="res-select" style="max-width:320px">キャラを選び直す</button>
      <button class="btn ghost" id="res-title" style="max-width:320px">タイトルへ</button>
    </div>
  </section>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box"><div id="modal-body"></div><button id="modal-close">閉じる</button></div>
</div>

<script src="firebase-config.js"></script>
<script src="game.js"></script>
<script src="net.js"></script>
</body>
</html>
